# Based on llama2_7b_continued.yaml.
data:
  id: dlwh/wikitext_103_detokenized
  tokenizer: meta-llama/Llama-3.1-8B
  format:
    type: ul2r
    text_key: text
    task_configs:
      r:
        type: r
        mask_prob: 0.15
        mean_span_length: 3.0
        random_roll: true
        task_token: "<|reserved_special_token_3|>"
      x1:
        type: x # TODO just type: rx?
        mask_prob: 0.15
        mean_span_length: 32.0
        random_roll: true
        task_token: "<|reserved_special_token_4|>"
      x2:
        type: x
        mask_prob: 0.5
        mean_span_length: 3.0
        random_roll: true
        task_token: "<|reserved_special_token_4|>"
      s:
        type: s
        task_token: "<|reserved_special_token_5|>"
    task_probs:
      r: 0.5
      x1: 0.125
      x2: 0.125
      s: 0.25
    rng_seed: 42

data_only: true

# TODO haven't tested any of the model stuff yet

model:
  type: llama
initialize_from_hf: meta-llama/Llama-3.1-8B
use_hf_model_config: true

trainer:
  tracker:
    type: wandb
    project: "levanter"
    tags: ["ul2r", "llama3", "wikitext"]

  mp: p=f32,c=bfloat16

  model_axis_size: 1
  per_device_eval_parallelism: 4

  train_batch_size: 1024
  num_train_steps: 10000
  steps_per_eval: 500

optimizer:
  learning_rate: 1.2e-4
  weight_decay: 0.0
