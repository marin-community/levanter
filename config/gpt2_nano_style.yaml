model:
  type: gpt2
  seq_len: 256
  hidden_dim: 256
  num_layers: 4
  num_heads: 4

trainer:
  num_train_steps: 20
  per_device_parallelism: 1
  train_batch_size: 2
  steps_per_eval: 20

optimizer:
  type: adam
  learning_rate: 1e-4

data:
  cache_dir: ./data/style_demo/cache
  tokenizer: gpt2
  format:
    type: chat
    single_turn: false
    chat_template: |
      {%- for message in messages -%}
      {{ message['role'] }}: {{ message['content'] }}
      {%- endfor -%}
      {%- if add_generation_prompt %}assistant:{% endif %}
    mask_user_turns: false
    style_prefix:
      prefix_token: "<style>"
      suffix_token: "</style>"
      style_field: "style"
  train_urls:
    - file://$PWD/data/style_demo/train.jsonl
  validation_urls: []
