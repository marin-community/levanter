name: TPU Device Ordering Test

on:
  workflow_dispatch:

jobs:
  test-device-ordering:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jax_version: ["0.6.2", "0.7.2"]
    env:
      TPU_ZONE: "us-central2-b"

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Google Cloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      - name: Create VM and install JAX ${{ matrix.jax_version }}
        run: |
          export TPU_NAME=jax-${{ matrix.jax_version }}-${{ github.run_id }}
          export JAX_VERSION=${{ matrix.jax_version }}
          eval "$(ssh-agent -s)"
          TRUE_SHA=${{ github.sha }}
          bash infra/spin-up-vm.sh $TPU_NAME -z ${TPU_ZONE} -t v4-8 --preemptible -s infra/helpers/setup-tpu-vm-tests.sh -b ${TRUE_SHA} --retries 1

      - name: Run device ordering test
        run: |
          export TPU_NAME=jax-${{ matrix.jax_version }}-${{ github.run_id }}
          gcloud compute tpus tpu-vm ssh $TPU_NAME --zone ${TPU_ZONE} --command "cd levanter && source .venv/bin/activate && python infra/test_device_ordering.py"

      - name: Run all tests
        run: |
          export TPU_NAME=jax-${{ matrix.jax_version }}-${{ github.run_id }}
          gcloud compute tpus tpu-vm ssh $TPU_NAME --zone ${TPU_ZONE} --command "JAX_TRACEBACK_FILTERING=off PYTHONPATH=\$PYTHONPATH:levanter/tests CI=1 bash levanter/infra/run.sh pytest levanter/tests -m 'not entry and not ray' -vv --durations=20"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          export TPU_NAME=jax-${{ matrix.jax_version }}-${{ github.run_id }}
          gcloud compute tpus tpu-vm delete $TPU_NAME --zone ${TPU_ZONE} --quiet
